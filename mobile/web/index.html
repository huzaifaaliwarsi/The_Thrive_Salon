<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The Thrive Salon Management System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Thrive Salon">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The Thrive Salon</title>
  <link rel="manifest" href="manifest.json">

  <!-- Material Icons Font & Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Explicit Font Faces for Material Icons and Lucide Icons -->
  <style>
    /* Material Icons font definition with Google Fonts fallback */
    @font-face {
      font-family: 'MaterialIcons';
      src: url('assets/fonts/MaterialIcons-Regular.otf') format('opentype'),
           url('https://fonts.gstatic.com/s/materialicons/v142/flUhRq6tzZclQEJ-Vdg-IuiaDsNcIhQ8tQ.woff2') format('woff2');
      font-display: block;
    }

    /* Lucide font definitions supporting all Flutter Web naming conventions */
    @font-face {
      font-family: 'Lucide';
      src: url('assets/packages/lucide_icons/assets/lucide.ttf') format('truetype'),
           url('assets/fonts/lucide.ttf') format('truetype'),
           url('assets/assets/fonts/lucide.ttf') format('truetype');
      font-display: block;
    }

    @font-face {
      font-family: 'packages/lucide_icons/Lucide';
      src: url('assets/packages/lucide_icons/assets/lucide.ttf') format('truetype'),
           url('assets/fonts/lucide.ttf') format('truetype'),
           url('assets/assets/fonts/lucide.ttf') format('truetype');
      font-display: block;
    }
  </style>

  <!-- Preload fonts to ensure immediate rendering -->
  <link rel="preload" href="assets/packages/lucide_icons/assets/lucide.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="font" type="font/otf" crossorigin>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <!-- SuperAdmin Branch Refill Dialog Modal -->
  <script>
    (function() {
      window.__showRefillDialog = function(branch) {
        const existing = document.getElementById('refill-modal-overlay');
        if (existing) existing.remove();

        const branchName = branch.name || 'Branch';
        const branchId = branch.id;

        const overlay = document.createElement('div');
        overlay.id = 'refill-modal-overlay';
        overlay.style.cssText = `
          position: fixed; inset: 0; z-index: 99999999;
          background: rgba(0, 0, 0, 0.45);
          display: flex; align-items: center; justify-content: center;
          font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          padding: 16px;
        `;

        overlay.innerHTML = `
          <div style="background: #FFFFFF; width: 100%; max-width: 400px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden; padding: 24px; box-sizing: border-box;">
            <!-- Header -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
              <div>
                <h3 style="margin: 0; font-size: 18px; font-weight: 700; color: #1B1B3A;">Refill Subscription</h3>
                <p style="margin: 4px 0 0 0; font-size: 13px; color: #6B7280; font-weight: 500;">Branch: <b>${branchName}</b></p>
              </div>
              <button id="rf-close-btn" style="background: none; border: none; font-size: 20px; color: #9CA3AF; cursor: pointer; padding: 0; line-height: 1;">✕</button>
            </div>

            <!-- Select Months -->
            <div style="margin-bottom: 24px;">
              <label style="display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px;">Select Duration</label>
              <select id="rf-duration-select" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1.5px solid #E5E7EB; border-radius: 10px; font-size: 14px; font-weight: 600; color: #1F2937; background: #FFFFFF; outline: none; cursor: pointer;">
                <option value="30">1 Month (30 Days)</option>
                <option value="90">3 Months (90 Days)</option>
                <option value="180">6 Months (180 Days)</option>
                <option value="365">1 Year (365 Days)</option>
                <option value="lifetime">Lifetime</option>
              </select>
            </div>

            <!-- Error Box -->
            <div id="rf-error" style="display: none; padding: 10px 12px; background: #FEE2E2; color: #DC2626; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 16px;"></div>

            <!-- Action Buttons -->
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
              <button id="rf-cancel-btn" type="button" style="padding: 10px 18px; background: #F3F4F6; color: #4B5563; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;">Cancel</button>
              <button id="rf-submit-btn" type="button" style="padding: 10px 22px; background: #6A11CB; color: #FFFFFF; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;">Refill</button>
            </div>
          </div>
        `;

        document.body.appendChild(overlay);

        const select = overlay.querySelector('#rf-duration-select');
        const errorBox = overlay.querySelector('#rf-error');
        const submitBtn = overlay.querySelector('#rf-submit-btn');
        const cancelBtn = overlay.querySelector('#rf-cancel-btn');
        const closeBtn = overlay.querySelector('#rf-close-btn');

        const closeDialog = () => overlay.remove();
        cancelBtn.addEventListener('click', closeDialog);
        closeBtn.addEventListener('click', closeDialog);
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) closeDialog();
        });

        submitBtn.addEventListener('click', async () => {
          errorBox.style.display = 'none';
          submitBtn.disabled = true;
          submitBtn.textContent = 'Refilling...';

          try {
            let token = window.__authToken;
            if (!token) {
              token = localStorage.getItem('token');
            }
            if (!token) {
              for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k.toLowerCase().includes('token')) {
                  const val = localStorage.getItem(k);
                  if (val && val.length > 20) {
                    try {
                      const parsed = JSON.parse(val);
                      token = typeof parsed === 'string' ? parsed : (parsed.token || val);
                    } catch(e) {
                      token = val;
                    }
                    break;
                  }
                }
              }
            }

            const val = select.value;
            const payload = val === 'lifetime' ? { isLifetime: true } : { days: parseInt(val, 10) };

            const res = await fetch(`https://api.thrive.isywarecloud.com/api/salons/${branchId}/subscription`, {
              method: 'PATCH',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {})
              },
              body: JSON.stringify(payload)
            });

            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
              throw new Error(data.message || `Error ${res.status}`);
            }

            submitBtn.textContent = 'Done!';
            submitBtn.style.background = '#10B981';

            setTimeout(() => {
              closeDialog();
              if (typeof branch.onSuccess === 'function') {
                branch.onSuccess();
              }
            }, 500);

          } catch (err) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Refill';
            errorBox.textContent = err.message || 'Failed to refill. Please try again.';
            errorBox.style.display = 'block';
          }
        });
      };
    })();
  </script>
</body>
</html>
